[pytest]
# 2026-09-10 리팩토링 Tier 4.3. 실행: cd Assets/Scripts && python -m pytest
# - test_golden.py           : 학습기 기본값 비트동일 (3케이스, CPU 2~3분/케이스)
# - test_vessel_gym_fidelity : GPU 배치 시뮬 vs C# 전사 스칼라 참조
# 미러 검증기 _verify_ppo_mirror.py / _verify_comm_mirror.py 는 자체 러너 (run_repro.sh preflight 가 호출)
testpaths = Python
python_files = test_*.py
addopts = -x -q
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
